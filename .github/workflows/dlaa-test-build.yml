name: DLAA test build

# A test patch for the dlaa branch: the worker built from this commit and the
# Python files that changed, to extract over a NeuralScreen v2.6.4 install.
# Push a tag named dlaa-test-*, or push the commit to the branch
# dlaa-test-build (the tag is then dlaa-test-<run number>), to build it and
# publish it as a pre-release; "Run workflow" on the Actions tab builds it
# without publishing (the zips are then workflow artifacts).
#
# Two zips. The patch goes over a v2.6.4 folder and carries no NVIDIA runtime.
# The full install is the published v2.6.4 archive with the patch laid over it
# and NVIDIA's DLSS runtime (nvngx_dlss.dll, the DLSS SDK's redistributable,
# signature checked, with its license) added, so it runs as it is unpacked.
on:
  push:
    tags:
      - 'dlaa-test-*'
    branches:
      - dlaa-test-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build the worker
        shell: cmd
        run: |
          call native\build-host.bat > build.log 2>&1
          set BUILD_EXIT=%ERRORLEVEL%
          type build.log
          exit /b %BUILD_EXIT%

      - name: Show build errors
        if: failure()
        shell: pwsh
        run: |
          # Job logs need a GitHub sign-in to read; annotations do not. The
          # compiler's error lines go into a few annotations, several per one.
          if (-not (Test-Path -LiteralPath 'build.log')) { Write-Host '::error::build.log was not written'; exit 0 }
          $lines = @(Get-Content -LiteralPath 'build.log' | Select-String -Pattern 'error|fatal|cannot|not found' | Select-Object -First 40 | ForEach-Object { "$_" })
          if (-not $lines) { $lines = @(Get-Content -LiteralPath 'build.log' | Select-Object -Last 20) }
          for ($i = 0; $i -lt $lines.Count; $i += 8) {
            $chunk = ($lines[$i..([Math]::Min($i + 7, $lines.Count - 1))] -join "`n")
            Write-Host ('::error::' + $chunk.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A'))
          }

      - name: Package the patch
        id: package
        shell: pwsh
        run: |
          $sha = $env:GITHUB_SHA
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME }
                 elseif ($env:GITHUB_REF_NAME -eq 'dlaa-test-build') { "dlaa-test-$($env:GITHUB_RUN_NUMBER)" }
                 else { "dlaa-test-$($sha.Substring(0, 8))" }
          $stage = Join-Path $env:RUNNER_TEMP 'patch'
          New-Item -ItemType Directory -Force -Path "$stage\app", "$stage\native\libraries" | Out-Null
          Copy-Item -Path 'app\*.py' -Destination "$stage\app"
          foreach ($file in 'main.py', 'config.default.json', 'README.md', 'README.ru.md', 'TECHNICAL.md', 'TECHNICAL.ru.md') {
            Copy-Item -LiteralPath $file -Destination $stage
          }
          Copy-Item -LiteralPath 'native\libraries\README.md' -Destination "$stage\native\libraries"
          foreach ($file in 'nvngx.dll', 'nvngx.dll_ns-forwarder.dll', 'nvngx.dll.manifest') {
            if (Test-Path -LiteralPath "native\$file") { Copy-Item -LiteralPath "native\$file" -Destination "$stage\native" }
          }
          if (-not (Test-Path -LiteralPath "$stage\native\nvngx.dll")) { throw 'the worker was not built' }
          # A new VERSION.txt makes the app drop its compiled Python cache on
          # the first start (main.py), so the new modules are what runs.
          @("NeuralScreen 2.6.4-dlaa", "commit: $sha", "tag: $tag") |
            Set-Content -LiteralPath "$stage\VERSION.txt" -Encoding utf8
          Copy-Item -LiteralPath 'docs\DLAA-TEST.md' -Destination "$stage\DLAA-TEST.md"
          $zip = Join-Path $env:GITHUB_WORKSPACE "NeuralScreen-$tag-patch.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip
          Get-ChildItem -Recurse $stage | Select-Object -ExpandProperty FullName
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Package the full install
        id: full
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.package.outputs.tag }}"
          $base = Join-Path $env:RUNNER_TEMP 'neuralscreen-v2.6.4-full.zip'
          gh release download v2.6.4 --repo perseval-BLR/NeuralScreen `
            --pattern 'neuralscreen-v2.6.4-full.zip' --output $base
          $full = Join-Path $env:RUNNER_TEMP 'full'
          Expand-Archive -LiteralPath $base -DestinationPath $full
          foreach ($need in 'NeuralScreen.exe', 'runtime\python.exe', 'native\nvngx_dlssnr.dll', 'native\nvngx_dlssg.dll') {
            if (-not (Test-Path -LiteralPath (Join-Path $full $need))) { throw "the v2.6.4 archive has no $need" }
          }
          Copy-Item -Path (Join-Path $env:RUNNER_TEMP 'patch\*') -Destination $full -Recurse -Force
          # DLAA's runtime, next to the worker (native\libraries\ stays the
          # user's override). Refused unless NVIDIA signed it.
          $dlss = Join-Path $full 'native\nvngx_dlss.dll'
          Invoke-WebRequest -Uri 'https://github.com/NVIDIA/DLSS/raw/main/lib/Windows_x86_64/rel/nvngx_dlss.dll' -OutFile $dlss
          $sig = Get-AuthenticodeSignature -LiteralPath $dlss
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'NVIDIA') {
            throw "nvngx_dlss.dll is not NVIDIA-signed: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
          Write-Host "nvngx_dlss.dll $((Get-Item $dlss).VersionInfo.FileVersion), $((Get-Item $dlss).Length) bytes"
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/NVIDIA/DLSS/main/LICENSE.txt' `
            -OutFile (Join-Path $full 'native\NVIDIA-DLSS-LICENSE.txt')
          # The archive's own checksum list, for the files it now holds (the
          # format build_release_zip.py writes: "<sha256> *<path>").
          $sums = Get-ChildItem -LiteralPath $full -Recurse -File | Where-Object Name -ne 'SHA256SUMS' | ForEach-Object {
            $rel = $_.FullName.Substring($full.Length + 1).Replace('\', '/')
            [pscustomobject]@{ Path = $rel; Hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          } | Sort-Object { $_.Path } -CaseSensitive | ForEach-Object { "$($_.Hash) *$($_.Path)" }
          [IO.File]::WriteAllText((Join-Path $full 'SHA256SUMS'), (($sums -join "`n") + "`n"))
          $zip = Join-Path $env:GITHUB_WORKSPACE "NeuralScreen-$tag-full.zip"
          Push-Location $full
          7z a -tzip -mx=5 $zip * | Out-Null
          Pop-Location
          Write-Host "full install: $((Get-Item $zip).Length) bytes"
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Keep the zips as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dlaa-test-build
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.full.outputs.zip }}

      - name: Publish the pre-release
        if: github.ref_type == 'tag' || github.ref_name == 'dlaa-test-build'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.package.outputs.tag }}" "${{ steps.full.outputs.zip }}" "${{ steps.package.outputs.zip }}" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --prerelease `
            --title "DLAA test build (${{ steps.package.outputs.tag }})" `
            --notes-file 'docs\DLAA-TEST.md'
